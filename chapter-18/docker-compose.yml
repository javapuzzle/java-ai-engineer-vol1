services:
  postgres:
    image: postgres:16-alpine
    container_name: ch18-postgres
    environment:
      POSTGRES_DB: acme_retail
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
    ports:
      - "5432:5432"
    volumes:
      - ch18-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme_retail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ch18-postgres-data:
